version: '3.8'

services:
  service1-1:
    build: ./service1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - service2

  service1-2:
    build: ./service1
    depends_on:
      - service2

  service1-3:
    build: ./service1
    depends_on:
      - service2

  service2:
    build: ./service2

  nginx:
    image: nginx:latest
    ports:
      - "8198:80"  # External port exposed for the system
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro  
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - service1-1
      - service1-2
      - service1-3
      - api_gateway

  api_gateway:
    build: ./api-gateway
    ports:
      - "8197:8197"  # Port for the API Gateway service
    volumes:
      - ./api-gateway:/app
    depends_on:
      - service1-1
      - service1-2
      - service1-3
      - service2
