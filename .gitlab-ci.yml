stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - docker-compose build

test:
  stage: test
  script:
    - docker-compose up -d
    - python tests/test_state.py
    - docker-compose down

deploy:
  stage: deploy
  script:
    - docker-compose up -d
  environment:
    name: production
