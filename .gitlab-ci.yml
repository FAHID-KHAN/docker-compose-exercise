stages:
  - build
  - test
  - static-analysis
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  TEST_REPORTS_DIR: tests/reports

# Build Stage
build:
  stage: build
  tags:
    - macbook  # Ensure this matches the tag in the GitLab runner
  script:
    - echo "Building Docker images..."
    - docker-compose build
  artifacts:
    when: always
    paths:
      - ./api-gateway
      - ./service1
      - ./service2

test:
  stage: test
  dependencies:
    - build
  tags:
    - macbook  # Ensure this matches the tag in the GitLab runner
  script:
    - echo "Starting containers for testing..."
    - docker-compose up -d
    - echo "Running API Gateway tests..."
    - mkdir -p ${TEST_REPORTS_DIR}
    - python3 -m pytest tests/test_api_gateway.py --junitxml=${TEST_REPORTS_DIR}/test_api_gateway.xml
    - echo "Running Service1 tests..."
    - python3 -m pytest tests/test_service1.py --junitxml=${TEST_REPORTS_DIR}/test_service1.xml
    - echo "Running Service2 tests..."
    - python3 -m pytest tests/test_service2.py --junitxml=${TEST_REPORTS_DIR}/test_service2.xml
    - echo "Tearing down test containers..."
    - docker-compose down
  allow_failure: true
  artifacts:
    when: always
    paths:
      - ${TEST_REPORTS_DIR}  # Store test reports for review
    reports:
      junit:
        - ${TEST_REPORTS_DIR}/test_api_gateway.xml
        - ${TEST_REPORTS_DIR}/test_service1.xml
        - ${TEST_REPORTS_DIR}/test_service2.xml

# Static Analysis Stag
static-analysis:
  stage: static-analysis
  tags:
    - macbook 
  script:
    - echo "Running static analysis..."
    - pip install pylint
    - pylint api-gateway/api_gateway.py service1/service1.py
    - echo "Static analysis complete."
  allow_failure: true  # Does not block pipeline if this stage fails
  artifacts:
    when: always
    paths:
      - pylint-report.txt
  script:
    - echo "Running pylint for Python files..."
    - pylint api-gateway/api_gateway.py service1/service1.py > pylint-report.txt || true
    - echo "Static analysis completed."

deploy:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Stopping any existing containers..."
    - docker-compose down || true
    - echo "Cleaning up stopped containers..."
    - docker container prune -f || true
    - echo "Cleaning up unused networks..."
    - docker network prune -f || true
    - echo "Deploying containers..."
    - docker-compose up -d
  environment:
    name: production
    url: http://localhost:8198
  only:
    - main
    - project